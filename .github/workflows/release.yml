name: Build and publish release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate module metadata
        run: |
          test -f README.md
          test -f library.json
          test -f AlarmMonitor/module.php
          test -f AlarmMonitor/module.json
          test -f AlarmMonitor/form.json
          test -f MessageCenter/module.php
          test -f MessageCenter/module.json
          test -f MessageCenter/form.json
          php -l AlarmMonitor/module.php
          php -l MessageCenter/module.php
          php -r '$l=json_decode(file_get_contents("library.json"), true, 512, JSON_THROW_ON_ERROR); foreach (["AlarmMonitor/module.json", "MessageCenter/module.json"] as $path) { $m=json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR); if (($m["version"] ?? null) !== ($l["version"] ?? null)) { fwrite(STDERR, "Version mismatch in ".$path."\n"); exit(1); } } if ("v".$l["version"] !== getenv("GITHUB_REF_NAME")) { fwrite(STDERR, "Git tag must match library version (for example v1.55)\n"); exit(1); } echo "Library version ".$l["version"]." validated.\n";'

      - name: Create installable ZIP
        run: |
          zip -r "SymconAlarmMonitor-${GITHUB_REF_NAME}.zip" README.md library.json AlarmMonitor MessageCenter

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: SymconAlarmMonitor-${{ github.ref_name }}.zip
